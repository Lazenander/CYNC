[package]
name = "cync"
version = "0.1.0"
edition = "2021"

[dependencies]
logos = "0.14"
log = "0.4.27"
walkdir = "2"
fs_extra = "1.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

clap = { version = "4.4", features = ["derive"] }
phf = { version = "0.13.1", features = ["macros"] }
paste = "1.0.15"
derivative = "2.2.0"